<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Agra Drive Simulator</title>
<style>
*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#070707;color:#fff;font-family:Arial,sans-serif}
#game{position:fixed;inset:0}canvas{display:block}
.panel{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(#0008,#000b);z-index:5}
.card{width:min(92vw,520px);padding:24px;border:1px solid #ffffff22;border-radius:22px;background:#111d;backdrop-filter:blur(10px);box-shadow:0 15px 60px #000}
h1{margin:0 0 6px;font-size:30px}.sub{color:#bbb;margin-bottom:18px}.btn{width:100%;padding:14px;margin:7px 0;border:0;border-radius:12px;background:#eee;color:#111;font-size:16px;font-weight:700}.btn.alt{background:#242424;color:#fff;border:1px solid #444}.hidden{display:none!important}
#hud{position:fixed;inset:0;pointer-events:none;z-index:3}.top{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;gap:8px}.pill{background:#000a;border:1px solid #fff2;border-radius:12px;padding:9px 11px;font-size:13px}
#controls{position:fixed;left:0;right:0;bottom:10px;height:180px;z-index:4;pointer-events:none}
.control{position:absolute;pointer-events:auto;user-select:none;touch-action:none;border:1px solid #fff3;background:#0008;color:white;border-radius:50%;width:72px;height:72px;display:grid;place-items:center;font-weight:800}
#left{left:18px;bottom:24px}#right{left:104px;bottom:24px}#gas{right:18px;bottom:24px}#brake{right:104px;bottom:24px}
#gearbox{position:absolute;right:18px;bottom:104px;display:flex;gap:5px;pointer-events:auto}
.gear{width:42px;height:42px;border-radius:9px;border:1px solid #fff3;background:#000a;color:white;font-weight:bold}
#actions{position:absolute;right:18px;top:64px;display:flex;flex-direction:column;gap:6px;pointer-events:auto}
.small{padding:9px 11px;border-radius:9px;background:#000b;color:#fff;border:1px solid #fff2}
#toast{position:fixed;bottom:205px;left:50%;transform:translateX(-50%);background:#000c;padding:10px 14px;border-radius:10px;z-index:9;display:none}
.row{display:flex;gap:8px;flex-wrap:wrap}.swatch{width:38px;height:38px;border-radius:50%;border:2px solid #fff4}
</style>
</head>
<body>
<div id="game"></div>
<div id="menu" class="panel"><div class="card">
<h1>AGRA DRIVE SIMULATOR</h1><div class="sub">M5-inspired performance sedan • Manual • Open World + Taxi Missions</div>
<button class="btn" onclick="start('open')">OPEN WORLD</button>
<button class="btn alt" onclick="start('mission')">MISSIONS — TAXI DRIVER</button>
<button class="btn alt" onclick="showGarage()">GARAGE / TUNING</button>
<p style="font-size:12px;color:#999">Prototype build. Vehicle is an original M5-inspired design, not an exact BMW replica.</p>
</div></div>
<div id="garage" class="panel hidden"><div class="card">
<h1>GARAGE</h1><div class="sub">Money: ₹<span id="money2">0</span></div>
<b>Colour</b><div class="row" id="colors"></div>
<p>Engine: <b id="engineName">V6</b></p>
<div class="row"><button class="small" onclick="upgradeEngine()">Upgrade engine</button><button class="small" onclick="buyTurbo()">Buy turbo</button></div>
<p>Turbo: <span id="turboName">None</span> • Power: <span id="power">100%</span></p>
<button class="btn" onclick="closeGarage()">BACK</button>
</div></div>
<div id="hud">
<div class="top"><div class="pill">₹<span id="money">0</span></div><div class="pill"><span id="speed">0</span> km/h • Gear <span id="gearNow">N</span></div><div class="pill"><span id="mode">OPEN</span></div></div>
<div id="actions"><button class="small" onclick="cameraNext()">CAMERA</button><button class="small" onclick="toggleDay()">DAY/NIGHT</button><button class="small" onclick="toggleSport()">SPORT: OFF</button><button class="small" onclick="toggleDrift()">DRIFT: OFF</button><button class="small" onclick="showGarage()">TUNING</button></div>
</div>
<div id="controls">
<div id="left" class="control">◀</div><div id="right" class="control">▶</div><div id="brake" class="control">BRAKE</div><div id="gas" class="control">GAS</div>
<div id="gearbox"><button class="gear" onclick="setGear(-1)">R</button><button class="gear" onclick="setGear(0)">N</button><button class="gear" onclick="setGear(1)">1</button><button class="gear" onclick="setGear(2)">2</button><button class="gear" onclick="setGear(3)">3</button><button class="gear" onclick="setGear(4)">4</button><button class="gear" onclick="setGear(5)">5</button><button class="gear" onclick="setGear(6)">6</button></div>
</div>
<div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.min.js"></script>
<script>
let scene,camera,renderer,car,roadGroup,traffic=[],clock;
let money=0, gear=0, speed=0, camMode=0, night=false, sport=false, drift=false, mode='open';
let steer=0, gas=false, brake=false, engine=0, turbo=0, carColor=0x111111;
const engines=[['V6',100],['V8',125],['V10',155],['V12',190],['V16',240]];
const colors=[0x111111,0xffffff,0x9b111e,0x0b3d91,0x15803d,0x777777,0xffd400];

function init(){
 scene=new THREE.Scene(); scene.fog=new THREE.Fog(0x9ab5c8,80,500);
 camera=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,.1,1000);
 renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;document.getElementById('game').appendChild(renderer.domElement);
 const hemi=new THREE.HemisphereLight(0xbfd8ff,0x222222,1.5);scene.add(hemi);
 const sun=new THREE.DirectionalLight(0xffffff,2);sun.position.set(80,120,50);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);scene.add(sun);
 clock=new THREE.Clock(); buildWorld(); buildCar(); animate();
}
function mat(c){return new THREE.MeshStandardMaterial({color:c,roughness:.6,metalness:.2})}
function box(w,h,d,c,x,y,z){let m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(c));m.position.set(x,y,z);m.castShadow=m.receiveShadow=true;scene.add(m);return m}
function buildWorld(){
 const ground=box(900,.2,900,0x7a8a68,0,0,0);
 roadGroup=new THREE.Group();scene.add(roadGroup);
 let road=box(22,.12,800,0x303030,0,.15,0);roadGroup.add(road);
 let lineMat=mat(0xffeaa0);
 for(let z=-390;z<390;z+=16){let l=box(.35,.04,8,0xffeaa0,0,.23,z);roadGroup.add(l)}
 for(let side of [-1,1]){
  for(let z=-360;z<360;z+=45){
   let h=10+Math.random()*35,w=10+Math.random()*16,d=10+Math.random()*16;
   let b=box(w,h,d,[0xc7b299,0xb5c7d9,0xd4a373,0x8d9b78][Math.floor(Math.random()*4)],side*(18+Math.random()*35),h/2,z);
   b.castShadow=b.receiveShadow=true;
  }
 }
 // highway lanes
 let hw=box(44,.13,800,0x272727,55,.16,0);roadGroup.add(hw);
 for(let z=-390;z<390;z+=16){let l=box(.3,.04,8,0xffffff,55,.23,z);roadGroup.add(l)}
 // Taj-style landmark silhouette
 let dome= new THREE.Mesh(new THREE.SphereGeometry(8,24,12,0,Math.PI*2,0,Math.PI/2),mat(0xe9e1d2));dome.position.set(-45,28,-120);scene.add(dome);
 for(let x of [-53,-37]) box(4,32,4,0xe9e1d2,x,16,-120);
}
function buildCar(){
 car=new THREE.Group();
 const body=new THREE.Mesh(new THREE.BoxGeometry(3.8,1,7.8),mat(carColor));body.position.y=1;body.castShadow=true;car.add(body);
 const cabin=new THREE.Mesh(new THREE.BoxGeometry(3.1,1.15,3.7),mat(0x171b20));cabin.position.set(0,1.8,.3);cabin.castShadow=true;car.add(cabin);
 const hood=new THREE.Mesh(new THREE.BoxGeometry(3.5,.25,2.0),mat(carColor));hood.position.set(0,1.35,-2.5);car.add(hood);
 const grille=box(1.7,.35,.12,0x090909,0,1.05,-3.93);grille.position.y=1.05;car.add(grille); // scene-added object, okay
 const wheelGeo=new THREE.CylinderGeometry(.58,.58,.38,24); 
 for(let x of [-1.9,1.9])for(let z of [-2.5,2.5]){let w=new THREE.Mesh(wheelGeo,mat(0x111111));w.rotation.z=Math.PI/2;w.position.set(x,0.58,z);w.castShadow=true;car.add(w)}
 car.position.set(0,0,0);scene.add(car);
}
function start(m){mode=m;document.getElementById('menu').classList.add('hidden');document.getElementById('mode').textContent=m.toUpperCase(); if(m==='mission')toast('Taxi mission: drive to the pickup marker. Max reward ₹1000.');}
function cameraNext(){camMode=(camMode+1)%3;toast(['Third person','Cockpit','Wide front'][camMode]);}
function setGear(g){gear=g;document.getElementById('gearNow').textContent=g<0?'R':g===0?'N':g}
function toggleDay(){night=!night;scene.background=new THREE.Color(night?0x050817:0x9ab5c8);scene.fog.color=new THREE.Color(night?0x050817:0x9ab5c8);toast(night?'Night: road lights on':'Day: shadows on')}
function toggleSport(){sport=!sport;document.querySelector('#actions .small:nth-child(3)').textContent='SPORT: '+(sport?'ON':'OFF')}
function toggleDrift(){drift=!drift;document.querySelector('#actions .small:nth-child(4)').textContent='DRIFT: '+(drift?'ON':'OFF')}
function showGarage(){document.getElementById('garage').classList.remove('hidden');document.getElementById('money2').textContent=money}
function closeGarage(){document.getElementById('garage').classList.add('hidden')}
function upgradeEngine(){if(engine<engines.length-1){let cost=(engine+1)*1000;if(money>=cost){money-=cost;engine++;toast('Engine upgraded to '+engines[engine][0]);updateGarage()}else toast('Need ₹'+cost)}else toast('Max engine reached')}
function buyTurbo(){if(turbo<3){let cost=(turbo+1)*700;if(money>=cost){money-=cost;turbo++;toast('Turbo level '+turbo+' installed');updateGarage()}else toast('Need ₹'+cost)}else toast('Max turbo reached')}
function updateGarage(){document.getElementById('money2').textContent=money;document.getElementById('engineName').textContent=engines[engine][0];document.getElementById('turboName').textContent=turbo?['','2 HP / 40 Nm','4 HP / 80 Nm','8 HP / 160 Nm'][turbo]:'None';document.getElementById('power').textContent=(100+engine*25+turbo*8)+'%';document.getElementById('money').textContent=money}
function makeColors(){let el=document.getElementById('colors');colors.forEach(c=>{let b=document.createElement('button');b.className='swatch';b.style.background='#'+c.toString(16).padStart(6,'0');b.onclick=()=>{carColor=c;car.children[0].material.color.set(c);car.children[2].material.color.set(c)};el.appendChild(b)})}
function toast(s){let t=document.getElementById('toast');t.textContent=s;t.style.display='block';clearTimeout(window.tt);window.tt=setTimeout(()=>t.style.display='none',1800)}
function bind(id,down,up){let e=document.getElementById(id);e.addEventListener('pointerdown',ev=>{ev.preventDefault();down()});e.addEventListener('pointerup',ev=>{ev.preventDefault();up()});e.addEventListener('pointercancel',up);e.addEventListener('pointerleave',up)}
bind('left',()=>steer=-1,()=>steer=0);bind('right',()=>steer=1,()=>steer=0);bind('gas',()=>gas=true,()=>gas=false);bind('brake',()=>brake=true,()=>brake=false);
addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')steer=-1;if(e.key==='ArrowRight'||e.key==='d')steer=1;if(e.key==='ArrowUp'||e.key==='w')gas=true;if(e.key==='ArrowDown'||e.key==='s')brake=true;if(e.key>='1'&&e.key<='6')setGear(+e.key);if(e.key==='0')setGear(0)});
addEventListener('keyup',e=>{if(['ArrowLeft','a','ArrowRight','d'].includes(e.key))steer=0;if(['ArrowUp','w'].includes(e.key))gas=false;if(['ArrowDown','s'].includes(e.key))brake=false});
function animate(){
 requestAnimationFrame(animate);let dt=Math.min(clock.getDelta(),.04);
 let ratio=gear>0?gear/6:0;
 let accel=gas&&gear>0 ? (sport?18:14)*(1+engine*.05+turbo*.03):0;
 if(brake) speed-=30*dt; else speed+=accel*dt;
 speed*=Math.pow(.985,dt*60); if(!gas&&speed>0)speed-=3*dt;
 if(gear<0){if(gas)speed=-Math.min(30,Math.abs(speed)+12*dt)}else if(gear===0)speed*=.97;
 let max= sport?240:192; speed=Math.max(-30,Math.min(max,speed));
 car.rotation.y += steer*dt*(0.7+Math.abs(speed)/120)*(drift?1.8:1);
 car.position.x += Math.sin(car.rotation.y)*speed*dt*.035;
 car.position.z += Math.cos(car.rotation.y)*speed*dt*.035;
 if(Math.abs(car.position.x)>90)car.position.x*=.99;
 let target=new THREE.Vector3();
 if(camMode===0)target.set(car.position.x+Math.sin(car.rotation.y)*-12,5.2,car.position.z+Math.cos(car.rotation.y)*-12);
 if(camMode===1)target.set(car.position.x,2.1,car.position.z);
 if(camMode===2)target.set(car.position.x+Math.sin(car.rotation.y)*-18,9,car.position.z+Math.cos(car.rotation.y)*-18);
 camera.position.lerp(target,.12);camera.lookAt(car.position.x,1,car.position.z+Math.cos(car.rotation.y)*10);
 document.getElementById('speed').textContent=Math.round(Math.abs(speed));document.getElementById('money').textContent=money;
 if(mode==='mission' && Math.random()<.0015){money+=Math.min(1000,Math.round(Math.abs(speed)*4));toast('Taxi ride completed! Fare added.')}
 renderer.render(scene,camera)
}
init();makeColors();updateGarage();
</script></body></html>
